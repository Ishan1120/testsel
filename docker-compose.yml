services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: testsel
      POSTGRES_PASSWORD: testsel
      POSTGRES_DB: testsel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testsel -d testsel"]
      interval: 5s
      timeout: 3s
      retries: 10

  collector:
    build:
      context: .
      dockerfile: infra/docker/collector.Dockerfile
    profiles: ["collect"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://testsel:testsel@postgres:5432/testsel
      GITHUB_TOKENS: ${GITHUB_TOKENS:-}
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./configs:/app/configs:ro
    command: ["testsel", "collect-all", "--config", "configs/repos.yaml"]

volumes:
  pgdata:
